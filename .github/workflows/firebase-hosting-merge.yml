name: Deploy customer web app (live)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: firebase-live
  cancel-in-progress: false

env:
  FIREBASE_PROJECT: dawadash-customer
  # Keyless auth (Workload Identity Federation); the provider only trusts this repo's ID.
  WIF_PROVIDER: projects/640291815709/locations/global/workloadIdentityPools/github/providers/github-oidc
  DEPLOY_SA: github-action-1450964627@dawadash-customer.iam.gserviceaccount.com
  FIREBASE_TOOLS: firebase-tools@15.34.2

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  build_and_deploy:
    needs: test
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:web
      - name: Smoke-check build output
        run: test -f web-dist/index.html && ls web-dist/_expo/static/js/web/*.js
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOY_SA }}
      - name: Deploy to Firebase Hosting (live)
        run: npx --yes ${{ env.FIREBASE_TOOLS }} deploy --only hosting --project "$FIREBASE_PROJECT" --non-interactive -m "${GITHUB_SHA::7} via GitHub Actions"
      - name: Smoke-check live site
        run: curl -fsS -o /dev/null -w "%{http_code}\n" "https://${FIREBASE_PROJECT}.web.app/"
