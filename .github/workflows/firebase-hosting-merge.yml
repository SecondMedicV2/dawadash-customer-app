name: Deploy customer web app (live)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: firebase-live
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    # Non-blocking until the 3 pre-existing test failures are fixed; then remove this line.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node --test src/*.test.mjs src/branding/*.test.cjs catalog.test.mjs

  build_and_deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:web
      - name: Smoke-check build output
        run: test -f web-dist/index.html && ls web-dist/_expo/static/js/web/*.js
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DAWADASH_CUSTOMER }}
          channelId: live
          projectId: dawadash-customer
